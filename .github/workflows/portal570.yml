# 570: the GlobalShortcuts portal on GNOME 51, headless (only on the public copy).
name: Portal 570

on:
  workflow_dispatch:
  push:
    branches: ["linux-copy-570"]
    paths: ["probe570/portal.py", "probe570/portal_fedora.sh", ".github/workflows/portal570.yml"]

permissions:
  contents: read

jobs:
  portal:
    name: GNOME 51's GlobalShortcuts portal (Fedora 45)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: "3.12.15"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - name: The portal, from an app that isn't a Flatpak
        run: bash probe570/portal_fedora.sh "$PWD/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: portal570
          path: out
          retention-days: 1
