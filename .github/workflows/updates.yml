name: updates
# 547: a toy Velopack AppImage built on Ubuntu 22.04, installed and updated
# in place from a local feed on Ubuntu 24.04 without libfuse2; does
# libxcb-cursor0 need bundling; does it start on Fedora.
on:
  push:
    branches: [updates]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner
        run: |
          mkdir -p out
          { grep -E '^PRETTY_NAME=' /etc/os-release; uname -r; ldd --version | head -1; } | tee out/runner.log
      - name: Build 1.0.0 and 1.0.1 in ubuntu:22.04
        run: docker run --rm -e GITHUB_ACTIONS -v "$PWD:/w" -w /w ubuntu:22.04 bash updates/build_in_2204.sh
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Pack with vpk 1.2.161
        run: bash updates/pack.sh
      - name: Install and update in place (no libfuse2)
        run: bash updates/round_trip.sh
      - name: libxcb-cursor0 and linkage on a clean ubuntu:24.04
        if: always()
        run: docker run --rm -e GITHUB_ACTIONS -v "$PWD:/w" -w /w ubuntu:24.04 bash updates/linkage_in_2404.sh
      - name: Fedora (linkage only)
        if: always()
        continue-on-error: true
        run: docker run --rm -e GITHUB_ACTIONS -v "$PWD:/w" -w /w fedora:latest bash updates/fedora.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: updates-logs
          path: out/
          retention-days: 1
