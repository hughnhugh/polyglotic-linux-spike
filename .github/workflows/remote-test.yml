# remote-test (polyglotic-hq 565): a desktop worktree's tests on GitHub's
# own runners, which are free for a public repo. `remote_test.py` pushes the
# worktree's source tree to a scratch branch `remote-test/...` of this copy,
# starts this workflow on it by hand (workflow_dispatch, nothing else), reads
# each shard's JUnit report back and deletes the branch and the reports.
#
# Each shard runs pytest on its own share of the test files (`plan`: base64
# of zlib of JSON, {"common": [args], "shards": [[args], ...]}). No secrets:
# the jobs have none, and their token can only read. The source of this
# file is polyglotic-hq's scripts/remote_test_workflow.yml; `remote_test.py
# --install` puts it here.
name: remote-test
run-name: ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The scratch branch, remote-test/...
        required: true
        type: string
      os:
        description: Where the tests run
        type: choice
        options: [linux, windows, macos]
        default: linux
      shards:
        description: The shards' numbers as JSON, e.g. [0,1,2]
        type: string
        default: "[0]"
      plan:
        description: Each shard's pytest arguments (base64 of zlib of JSON)
        required: true
        type: string

permissions:
  contents: read

env:
  PLAN: ${{ inputs.plan }}
  # The shard's share of the plan. pytest: its arguments, with a JUnit
  # report whose testcases carry their file (xunit1) and a failing test's
  # output. "each": one command per item ({} is the item), each reported as
  # a testcase of its own, its output's end as a failure's text.
  RUN_SHARD: |
    import base64, json, os, shutil, subprocess, sys, time, zlib
    from xml.sax.saxutils import escape, quoteattr
    plan = json.loads(zlib.decompress(base64.b64decode(os.environ["PLAN"])))
    shard = int(os.environ["SHARD"])
    os.makedirs("out", exist_ok=True)
    if "each" not in plan:
        # a list of parts, each one pytest process, side by side (the
        # machine's 4 CPUs; one pytest uses one)
        parts = plan["shards"][shard]
        flat = bool(parts) and isinstance(parts[0], str)  # one process (remote_test.py before 21:00)
        parts = [parts] if flat else parts
        running = []
        for part, args in enumerate(parts):
            name = f"junit-{shard}" if flat else f"junit-{shard}-{part}"
            # each process its own temporary folder: side by side, pytest's
            # shared numbered one lost a test's file to another's clean-up (565)
            base = os.path.join(os.environ.get("RUNNER_TEMP", "."), f"pytest-{shard}-{part}")
            report = [f"--basetemp={base}", f"--junitxml=out/{name}.xml", "-o", "junit_family=xunit1",
                      "-o", "junit_logging=all", "-o", "junit_log_passing_tests=False"]
            command = [shutil.which("pytest") or "pytest", "-p", "no:cacheprovider", *report,
                       *plan["common"], *args]
            log = open(f"out/log-{shard}-{part}.txt", "w", encoding="utf-8")
            running.append((part, len(args), subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT), log))
        worst = 0
        for part, count, process, log in running:
            code = process.wait()
            log.close()
            with open(log.name, encoding="utf-8", errors="replace") as said:
                print(f"::group::part {part} ({count} arguments): exit {code}\n{said.read()[-60000:]}\n::endgroup::", flush=True)
            worst = worst or code
        sys.exit(worst)
    from concurrent.futures import ThreadPoolExecutor
    began = time.time()
    def one(item):
        start = time.time()
        done = subprocess.run(plan["each"].replace("{}", item), shell=True, capture_output=True,
                              text=True, encoding="utf-8", errors="replace")
        return item, done.returncode, time.time() - start, (done.stdout + done.stderr)[-20000:]
    cases, failed = [], 0
    with ThreadPoolExecutor(max(1, int(plan.get("processes", 1)))) as pool:
        for item, code, took, said in pool.map(one, plan["shards"][shard]):
            print(f"::group::{item}: exit {code} in {took:.0f} s\n{said}\n::endgroup::", flush=True)
            failure = ""
            if code:
                failed += 1
                failure = f"<failure message={quoteattr(f'exit {code}')}>{escape(said)}</failure>"
            cases.append(f"<testcase classname=\"each\" name={quoteattr(item)} file=\"each\" "
                          f"time=\"{took:.2f}\">{failure}</testcase>")
    with open(f"out/junit-{shard}.xml", "w", encoding="utf-8") as junit:
        junit.write(f"<testsuites><testsuite name=\"each\" time=\"{time.time() - began:.2f}\">"
                    + "".join(cases) + "</testsuite></testsuites>")
    sys.exit(1 if failed else 0)

jobs:
  linux:
    # In the same image as the desktop's own Checks (Linux) runner on the
    # user's PC (polyglotic-hq scripts/RUNNERS.md), so its libraries and
    # fonts are the ones the private checks see
    name: linux ${{ matrix.shard }}
    if: ${{ inputs.os == 'linux' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Qt's system libraries
        run: bash tools/linux_qt_libs.sh "$RUNNER_TEMP/qt-libs" >> "$GITHUB_ENV"
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1

  windows:
    name: windows ${{ matrix.shard }}
    if: ${{ inputs.os == 'windows' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1

  macos:
    name: macos ${{ matrix.shard }}
    if: ${{ inputs.os == 'macos' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1
