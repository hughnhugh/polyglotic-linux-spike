# remote-test (polyglotic-hq 565): a desktop worktree's tests on GitHub's
# own runners, which are free for a public repo. `remote_test.py` pushes the
# worktree's source tree to a scratch branch `remote-test/...` of this copy,
# starts this workflow on it by hand (workflow_dispatch, nothing else), reads
# each shard's JUnit report back and deletes the branch and the reports.
#
# Each shard runs pytest on its own share of the test files (`plan`: base64
# of zlib of JSON, {"common": [args], "shards": [[args], ...]}). No secrets:
# the jobs have none, and their token can only read. The source of this
# file is polyglotic-hq's scripts/remote_test_workflow.yml; `remote_test.py
# --install` puts it here.
name: remote-test
run-name: ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The scratch branch, remote-test/...
        required: true
        type: string
      os:
        description: Where the tests run
        type: choice
        options: [linux, windows, macos]
        default: linux
      shards:
        description: The shards' numbers as JSON, e.g. [0,1,2]
        type: string
        default: "[0]"
      plan:
        description: Each shard's pytest arguments (base64 of zlib of JSON)
        required: true
        type: string

permissions:
  contents: read

env:
  PLAN: ${{ inputs.plan }}
  # The shard's arguments from the plan, then pytest with a JUnit report
  # whose testcases carry their file (xunit1), and a failing test's output
  RUN_SHARD: |
    import base64, json, os, shutil, subprocess, sys, zlib
    plan = json.loads(zlib.decompress(base64.b64decode(os.environ["PLAN"])))
    shard = int(os.environ["SHARD"])
    args = plan["common"] + plan["shards"][shard]
    os.makedirs("out", exist_ok=True)
    report = [f"--junitxml=out/junit-{shard}.xml", "-o", "junit_family=xunit1",
              "-o", "junit_logging=all", "-o", "junit_log_passing_tests=False"]
    command = [shutil.which("pytest") or "pytest", "-p", "no:cacheprovider", *report, *args]
    print(f"shard {shard}: {len(plan['shards'][shard])} arguments", flush=True)
    sys.exit(subprocess.call(command))

jobs:
  linux:
    # In the same image as the desktop's own Checks (Linux) runner on the
    # user's PC (polyglotic-hq scripts/RUNNERS.md), so its libraries and
    # fonts are the ones the private checks see
    name: linux ${{ matrix.shard }}
    if: ${{ inputs.os == 'linux' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/actions/actions-runner@sha256:759a1d94a15b05941aba5196974ff43fe15b4cbba29b694b35cbc32a1166b232
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Qt's system libraries
        run: bash tools/linux_qt_libs.sh "$RUNNER_TEMP/qt-libs" >> "$GITHUB_ENV"
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1

  windows:
    name: windows ${{ matrix.shard }}
    if: ${{ inputs.os == 'windows' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1

  macos:
    name: macos ${{ matrix.shard }}
    if: ${{ inputs.os == 'macos' && startsWith(inputs.ref, 'remote-test/') }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: The interface's translations (.qm)
        run: uv run --no-sync python -m tools.i18n build
      - name: Tests (this shard)
        run: printf '%s' "$RUN_SHARD" > "$RUNNER_TEMP/shard.py" && uv run --no-sync python "$RUNNER_TEMP/shard.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: junit-${{ matrix.shard }}
          path: out
          retention-days: 1
