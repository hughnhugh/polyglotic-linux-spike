# 570: hotkeys, popovers and the unlock spot on each desktop, through the
# compositor's own input (polyglotic-hq 570; only on the public Linux copy).
name: Probe 570

on:
  workflow_dispatch:
  push:
    branches: ["linux-copy-570"]
    paths: ["probe570/probe.py", "probe570/run.sh", "probe570/in_fedora.sh", ".github/workflows/probe570.yml"]

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.name }}
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: "Xvfb (an Xorg session)", screen: xvfb, where: runner}
          - {name: "Ubuntu 24.04 GNOME 46", screen: gnome, where: runner}
          - {name: "Fedora 45 GNOME", screen: gnome, where: fedora}
          - {name: "Fedora 45 KDE", screen: kde, where: fedora}
    env:
      OUT: ${{ github.workspace }}/out
      UV_PYTHON: "3.12.15"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The runner's parts
        if: ${{ matrix.where == 'runner' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mutter xwayland \
            pipewire pipewire-pulse pipewire-bin wireplumber libpulse0 pulseaudio-utils \
            dbus-bin dbus-daemon gnome-keyring xvfb libxtst6 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 fonts-noto-core
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install
        if: ${{ matrix.where == 'runner' }}
        run: uv sync --locked
      - name: The probe on the runner
        if: ${{ matrix.where == 'runner' }}
        env:
          LINUX_SESSION_SCREEN: ${{ matrix.screen }}
        run: dbus-run-session -- bash tools/linux_session.sh "$OUT/session" -- bash probe570/run.sh "$OUT"
      - name: The probe in Fedora
        if: ${{ matrix.where == 'fedora' }}
        run: bash probe570/in_fedora.sh ${{ matrix.screen }} "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: probe570-${{ matrix.where }}-${{ matrix.screen }}
          path: |
            ${{ env.OUT }}/*.json
            ${{ env.OUT }}/*.log
            ${{ env.OUT }}/*.out
            ${{ env.OUT }}/*.txt
            ${{ env.OUT }}/session/*.log
          retention-days: 1
