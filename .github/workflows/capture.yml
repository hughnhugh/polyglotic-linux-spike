name: capture
# 547 item 2: libpulse through ctypes on Ubuntu 24.04's own PipeWire.
on:
  push:
    branches: [capture]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: What the runner has before
        run: dpkg-query -W -f='${Package} ${Version}\n' 'pipewire*' 'pulseaudio*' wireplumber libpulse0 2>/dev/null || true
      - name: Install PipeWire from Ubuntu 24.04
        # pulseaudio-utils: paplay is app A, and pactl only cross-checks at the end
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q pipewire pipewire-pulse pipewire-bin wireplumber libpulse0 pulseaudio-utils dbus-bin dbus-daemon
      - name: Run the probe
        run: dbus-run-session -- bash capture/run.sh out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capture-${{ github.run_id }}
          path: |
            out/*.txt
            out/*.log
            out/*.json
          retention-days: 1
